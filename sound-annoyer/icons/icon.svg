<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SoundAnnoyer">
  <!-- Windows 98 dress: teal desktop, silver window, navy gradient caption.
       Colours are the genuine COLOR_* system values, matching css/styles.css. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#008080"/>

  <!-- window body + raised bevel -->
  <rect x="23" y="23" width="466" height="466" fill="#c0c0c0"/>
  <path d="M23 23h466v4H27v462h-4z" fill="#ffffff"/>
  <path d="M489 23v466H23v-4h462V23z" fill="#0a0a0a"/>
  <path d="M27 27h458v4H31v454h-4z" fill="#dfdfdf"/>
  <path d="M485 27v458H27v-4h454V27z" fill="#808080"/>

  <!-- title bar -->
  <rect x="34" y="34" width="444" height="86" fill="url(#cap)"/>
  <!-- close box -->
  <rect x="396" y="40" width="74" height="74" fill="#c0c0c0"/>
  <path d="M396 40h74v4h-70v70h-4z" fill="#ffffff"/>
  <path d="M470 40v74h-74v-4h70V40z" fill="#0a0a0a"/>
  <path d="M414 58l38 38M452 58l-38 38" stroke="#0a0a0a" stroke-width="9" stroke-linecap="square"/>

  <!-- sunken client area -->
  <rect x="34" y="130" width="444" height="348" fill="#ffffff"/>
  <path d="M34 130h444v5H39v343h-5z" fill="#808080"/>
  <path d="M478 130v348H34v-5h439V130z" fill="#ffffff"/>

  <!-- speaker -->
  <rect x="104" y="196" width="132" height="216" fill="#c0c0c0"/>
  <path d="M104 196h132v4h-128v212h-4z" fill="#ffffff"/>
  <path d="M236 196v216H104v-4h128V196z" fill="#0a0a0a"/>
  <circle cx="170" cy="243" r="23" fill="#0a0a0a"/>
  <circle cx="170" cy="332" r="39" fill="#505050" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="170" cy="332" r="17" fill="#0a0a0a"/>

  <!-- sound waves -->
  <g fill="none" stroke="#0a0a0a" stroke-width="15" stroke-linecap="round">
    <path d="M279 297a48 48 0 0 1 0 70"/>
    <path d="M316 274a95 95 0 0 1 0 116"/>
    <path d="M353 251a142 142 0 0 1 0 162"/>
  </g>
</svg>
