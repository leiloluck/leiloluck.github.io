<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0a0805"/>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#a07232" stroke-width="1.4"/>
  <!-- Tick marks at 12, 3, 6, 9 -->
  <line x1="50" y1="17.5" x2="50" y2="24" stroke="#c9934a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="82.5" y1="50" x2="76" y2="50" stroke="#c9934a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="50" y1="82.5" x2="50" y2="76" stroke="#c9934a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="17.5" y1="50" x2="24" y2="50" stroke="#c9934a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Hour hand at 10 o'clock (300° clockwise from 12) -->
  <!-- sin(300°)=−0.866, −cos(300°)=−0.5 → tip=(50−14.4, 50−8)=(35.6, 42) -->
  <line x1="50" y1="50" x2="35.6" y2="42" stroke="#c9934a" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Minute hand at 12 -->
  <line x1="50" y1="50" x2="50" y2="27.5" stroke="#c9934a" stroke-width="1.7" stroke-linecap="round" opacity="0.75"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="2.2" fill="#c9934a"/>
</svg>
