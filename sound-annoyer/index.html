<!DOCTYPE html>
<!-- index.html — /sound-annoyer/ retirement stub.
     The app moved to /poltergeist/ when it was renamed to poltergeist.exe. This page
     exists so old bookmarks, and any home-screen install still pointing here, land
     somewhere useful instead of a 404. sw.js in this folder retires the old service
     worker and its caches; without that, the old cache-first worker would keep serving
     the old app from cache and this page would never be seen. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moved to poltergeist.exe</title>
  <meta http-equiv="refresh" content="0; url=/poltergeist/">
  <link rel="canonical" href="/poltergeist/">
  <meta name="theme-color" content="#000080">
  <style>
    body { margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
           background:#008080; font-family:Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;
           font-size:13px; color:#000; padding:16px; }
    .win { max-width:360px; width:100%; background:#c0c0c0; padding:3px;
           box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf,
                       inset -2px -2px #808080, inset 2px 2px #ffffff; }
    .bar { background:linear-gradient(90deg,#000080,#1084d0); color:#fff; font-weight:bold;
           padding:3px 4px 4px 5px; }
    .body { padding:14px 12px; }
    p { margin:0 0 12px; line-height:1.5; }
    a.btn { display:inline-block; padding:8px 16px; min-height:38px; color:#000;
            text-decoration:none; background:#c0c0c0;
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff,
                        inset -2px -2px #808080, inset 2px 2px #dfdfdf; }
  </style>
</head>
<body>
  <div class="win">
    <div class="bar">Moved</div>
    <div class="body">
      <p>SoundAnnoyer is now <strong>poltergeist.exe</strong>, and it lives at a new address.</p>
      <p>If you had it installed, please install it again from the new page so it updates properly.</p>
      <p><a class="btn" href="/poltergeist/">Go to poltergeist.exe</a></p>
    </div>
  </div>
  <script>
    // Register the retirement worker BEFORE redirecting. An existing install already has
    // a worker at this scope and will pick the new bytes up on its own, but anyone whose
    // registration is already gone would otherwise leave orphaned sound-annoyer-* caches
    // behind forever. Registration survives the navigation away, so the cleanup still
    // runs; the redirect does not wait on it.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
    }
    location.replace('/poltergeist/');
  </script>
</body>
</html>
