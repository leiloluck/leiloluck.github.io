<!DOCTYPE html>
<!-- index.html — Meditation Timer
     Minimalist timed meditation with ambient audio fade in/out.
     PWA: installable, offline-capable, Media Session API for lock screen. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meditation Timer</title>

  <!-- Content Security Policy — no inline scripts/styles, same-origin only -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c9934a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meditate">
  <!-- PNG required for iOS home screen icon (SVG not supported) -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="app">

  <!-- Header -->
  <header class="header">
    <h1>Meditation Timer</h1>
    <p>breathe</p>
  </header>

  <!-- Countdown (always visible; shows selected duration when idle) -->
  <section class="countdown-section">
    <div class="countdown" id="countdown">15:00</div>
    <p class="duration-label" id="duration-label">15 min</p>
    <p class="status" id="status"></p>
    <p class="bell-hint">🕭 3 bells mark the end of session</p>
  </section>

  <!-- Play / Pause / Reset -->
  <section class="play-section">
    <div class="play-controls">
      <button class="btn-play" id="btn-play">Begin</button>
      <button class="btn-reset hidden" id="btn-reset">Reset</button>
    </div>
  </section>

  <!-- Sound selection -->
  <section class="section">
    <p class="section-label">Sound</p>
    <div class="btn-group" id="sound-group"></div>
  </section>

  <!-- Duration selection -->
  <section class="section">
    <p class="section-label">Duration</p>
    <div class="btn-group" id="duration-group"></div>
  </section>

  <!-- Footer: install + offline + version -->
  <footer class="footer">
    <button class="btn-small hidden" id="install-btn"></button>
    <button class="btn-small hidden" id="offline-btn">Download for offline</button>
    <span class="version">v09b.06.26</span>
  </footer>

</main>

<div class="modal-layer hidden" id="custom-modal-layer">
  <button class="modal-backdrop" id="custom-modal-dismiss" aria-label="Close custom duration dialog"></button>

  <section class="custom-modal" id="custom-modal" role="dialog" aria-modal="true" aria-labelledby="custom-modal-title" tabindex="-1">
    <p class="custom-modal-kicker">Custom duration</p>
    <h2 id="custom-modal-title">Set your session length</h2>
    <p class="custom-modal-copy">Choose any duration between 1 and 180 minutes.</p>

    <form class="custom-modal-form" id="custom-duration-form" novalidate>
      <p class="custom-modal-label">Minutes</p>

      <div class="custom-input-wrap custom-display" id="custom-duration-display" aria-live="polite" aria-atomic="true">
        <span class="custom-input" id="custom-duration-value">12</span>
        <span class="custom-input-unit">min</span>
      </div>

      <div class="custom-keypad" aria-label="Custom duration number pad">
        <button type="button" class="custom-keypad-btn" data-key="1">1</button>
        <button type="button" class="custom-keypad-btn" data-key="2">2</button>
        <button type="button" class="custom-keypad-btn" data-key="3">3</button>
        <button type="button" class="custom-keypad-btn" data-key="4">4</button>
        <button type="button" class="custom-keypad-btn" data-key="5">5</button>
        <button type="button" class="custom-keypad-btn" data-key="6">6</button>
        <button type="button" class="custom-keypad-btn" data-key="7">7</button>
        <button type="button" class="custom-keypad-btn" data-key="8">8</button>
        <button type="button" class="custom-keypad-btn" data-key="9">9</button>
        <button type="button" class="custom-keypad-btn custom-keypad-btn-muted" data-action="clear">Clear</button>
        <button type="button" class="custom-keypad-btn" data-key="0">0</button>
        <button type="button" class="custom-keypad-btn custom-keypad-btn-muted" data-action="backspace">Delete</button>
      </div>

      <p class="custom-modal-error" id="custom-duration-error"></p>

      <div class="custom-modal-actions">
        <button type="button" class="btn-reset custom-modal-btn" id="custom-duration-cancel">Cancel</button>
        <button type="submit" class="btn-play custom-modal-btn">Save</button>
      </div>
    </form>
  </section>
</div>

<script src="js/app.js"></script>

</body>
</html>
