<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum – Leilo Luck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #030712; }</style>
</head>
<body class="bg-gray-950 text-gray-400 font-sans min-h-screen flex flex-col items-center justify-center p-8 selection:bg-purple-500 selection:text-white">
    <div class="max-w-xl w-full">
        <a href="/" class="text-gray-600 text-sm hover:text-gray-400 transition-colors">&larr; Back</a>
        <h1 class="text-2xl font-bold text-white mt-6 mb-8">Impressum</h1>

        <p class="mb-4 text-sm leading-relaxed">
            Angaben gemäß § 5 DDG:
        </p>

        <div class="text-sm leading-relaxed space-y-1 mb-8">
            <p>Leilo Luck</p>
            <p>Großer Stern 1</p>
            <p>10557 Berlin</p>
            <p>Germany</p>
        </div>

        <p class="text-sm mb-1 font-medium text-gray-300">Kontakt</p>
        <div class="text-sm leading-relaxed space-y-1 mb-8">
            <p>E-Mail: <span id="email"></span></p>
        </div>

        <script>
            (function() {
                var u = 'leilo.luck';
                var d = 'gmail.com';
                var e = u + '@' + d;
                var el = document.getElementById('email');
                el.innerHTML = '<a href="mailto:' + e + '" class="underline hover:text-white transition-colors">' + e + '</a>';
            })();
        </script>

        <p class="text-xs text-gray-700 mt-12">
            Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV: siehe oben.
        </p>
    </div>
</body>
</html>
