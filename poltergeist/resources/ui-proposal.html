<!DOCTYPE html>
<!-- ui-proposal.html — poltergeist.exe: mock of the sound list (dev tool, NOT part of the app)
     Shown inside the "UI proposal" tab of dev.html (and works on its own). It links the REAL
     ../css/styles.css, so every bevel, colour and button, and the page rules (.page-tab, .pager,
     .page-grid), are the app's own. Nothing here is wired to the app: tapping a sound latches
     it (like arming) AND plays it, so the mock doubles as a listening room.

     This is the design the app ships (v26.10.27a): three pages (Haunted, Laughs, Animals &
     people), every sound of a page visible at once. Swipe sideways, tap the page buttons, or
     drag with a mouse. The page keeps scrolling vertically wherever a finger lands (the
     sideways scroller has no vertical overflow to capture) and nothing fades. The earlier
     "shelves" version (one swipeable row per group) is in git history, commit aebaf2d.
     Not shared code: the paging script below is a trimmed copy of wirePager() in js/app.js. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>poltergeist.exe — sound list (mock)</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { flex-direction: column; justify-content: flex-start; align-items: center; gap: 8px; padding-top: 8px; padding-bottom: 12px; }
  .app { min-height: 0; }
  .launch-section { gap: 8px; }
  .mock-note { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<main class="app">
  <header class="header">
    <h1 class="logo"><span class="logo-name">poltergeist.exe</span></h1>
    <button class="btn-close" type="button" aria-label="Close (mock)">&#215;</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" type="button" role="tab" aria-selected="true">🔊 Annoy</button>
    <button class="tab" type="button" role="tab" aria-selected="false">⚙ Settings</button>
    <button class="tab tab-info" type="button" role="tab" aria-selected="false">ⓘ what is this?</button>
  </nav>

  <section class="panel">
    <section class="launch-section">
      <div class="launch-row"><button class="btn-launch" type="button">Activate</button></div>
    </section>

    <section class="section sounds-section">
      <p class="section-label">Sounds
        <span class="label-right"><span class="section-hint">tap to arm</span>
        <button class="btn-tiny" type="button" id="all">Select all</button></span>
      </p>
      <div class="pages" id="sounds"></div>
    </section>

    <section class="section">
      <p class="section-label">How often <span class="section-hint">randomized around this</span></p>
      <div class="interval-grid">
        <button class="interval-btn" type="button">5 sec</button>
        <button class="interval-btn" type="button">30 sec</button>
        <button class="interval-btn" type="button">1 min</button>
        <button class="interval-btn" type="button">2 min</button>
        <button class="interval-btn selected" type="button">4 min</button>
        <button class="interval-btn" type="button">6 min</button>
      </div>
    </section>
    <p class="mock-note">Mock: tap a sound to latch it and hear it. Nothing is saved.</p>
  </section>
</main>

<audio id="player" preload="none"></audio>

<script>
'use strict';

// id, name, emoji, page, file (relative to resources/), as in the app.
const SOUNDS = [
  ['ghost-classic', 'Ghost', '👻', 'Haunted', 'ghost-classic.mp3'],
  ['ghost-woo', 'Wooo', '💨', 'Haunted', 'ghost-woo.mp3'],
  ['ghost-moan', 'Moan', '😮', 'Haunted', 'ghost-moan.mp3'],
  ['ghost-sad', 'Sad ghost', '😔', 'Haunted', 'ghost-sad.mp3'],
  ['ghost-cry', 'Ghost cry', '😢', 'Haunted', 'ghost-cry.mp3'],
  ['knock',   'Knock',    '🚪', 'Haunted', 'knock.mp3'],
  ['ding',    'Ding',     '🛎️', 'Haunted', 'ding.mp3'],
  ['vibrate', 'Vibrate',  '📳', 'Haunted', 'phone-vibrate.mp3'],

  ['l1',  'Kids laugh',   '🧒', 'Laughs', 'laugh-kids.mp3'],
  ['l2',  'Boy laugh',    '👦', 'Laughs', 'laugh-boy.mp3'],
  ['l3',  'Child laugh',  '🧒', 'Laughs', 'laugh-child.mp3'],
  ['l5',  'Woman laugh',  '👩', 'Laughs', 'laugh-woman.mp3'],
  ['l6',  'Guffaw',       '😂', 'Laughs', 'laugh-guffaw.mp3'],
  ['l9',  'Sitcom',       '📺', 'Laughs', 'laugh-sitcom.mp3'],
  ['l11', 'Crowd laugh',  '🤣', 'Laughs', 'laugh-crowd.mp3'],
  ['l12', 'Laugh track',  '🎞️', 'Laughs', 'laugh-track.mp3'],

  ['cat',      'Cat',          '🐱', 'Animals & people', 'kitty-meow.mp3'],
  ['dog',      'Dog',          '🐶', 'Animals & people', 'dog-bark.mp3'],
  ['mouse',    'Mouse',        '🐭', 'Animals & people', 'mouse-squeak.mp3'],
  ['bird',     'Sparrow',      '🐦', 'Animals & people', 'bird-chirp.mp3'],
  ['mbirds',   'Morning birds','🐤', 'Animals & people', 'morning-birds.mp3'],
  ['crickets', 'Crickets',     '🦗', 'Animals & people', 'crickets.mp3'],
  ['mosquito', 'Mosquito',     '🦟', 'Animals & people', 'mosquito.mp3'],
  ['sneeze',   'Sneeze',       '🤧', 'Animals & people', 'sneeze.mp3'],
  ['gasp',     'Crowd gasp',   '😱', 'Animals & people', 'crowd-gasp.mp3'],
].map(([id, name, emoji, page, file]) => ({ id, name, emoji, page, file }));

const PAGES = ['Haunted', 'Laughs', 'Animals & people'];
const armed = new Set(['cat', 'l1', 'ghost-classic']);
const player = document.getElementById('player');
const root = document.getElementById('sounds');
const allBtn = document.getElementById('all');
const refs = [];

function soundBtn(s) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'sound-btn' + (armed.has(s.id) ? ' armed' : '');
  b.dataset.id = s.id;
  b.setAttribute('aria-pressed', armed.has(s.id) ? 'true' : 'false');
  b.innerHTML = '<span class="s-emoji"></span><span class="s-label"><span class="s-name"></span></span>';
  b.querySelector('.s-emoji').textContent = s.emoji;
  b.querySelector('.s-name').textContent = s.name;
  b.addEventListener('click', () => {
    if (armed.has(s.id)) armed.delete(s.id); else armed.add(s.id);
    sync();
    if (armed.has(s.id)) { player.src = s.file; player.play().catch(() => {}); } else player.pause();
  });
  return b;
}

function sync() {
  document.querySelectorAll('.sound-btn').forEach(b => {
    const on = armed.has(b.dataset.id);
    b.classList.toggle('armed', on);
    b.setAttribute('aria-pressed', String(on));
  });
  refs.forEach(r => {
    const n = r.list.filter(s => armed.has(s.id)).length;
    r.sub.textContent = n ? n + ' of ' + r.list.length + ' on' : r.list.length + ' sounds';
    r.tab.classList.toggle('has-armed', n > 0);
  });
  allBtn.textContent = SOUNDS.every(s => armed.has(s.id)) ? 'Deselect all' : 'Select all';
}
allBtn.addEventListener('click', () => {
  const all = SOUNDS.every(s => armed.has(s.id));
  SOUNDS.forEach(s => all ? armed.delete(s.id) : armed.add(s.id));
  if (all) armed.add('cat');
  sync();
});

const tabs = document.createElement('div'); tabs.className = 'page-tabs'; tabs.setAttribute('role', 'tablist');
const pager = document.createElement('div'); pager.className = 'pager';
PAGES.forEach(name => {
  const list = SOUNDS.filter(s => s.page === name);
  const tab = document.createElement('button'); tab.type = 'button'; tab.className = 'page-tab'; tab.setAttribute('role', 'tab');
  tab.innerHTML = '<span class="pt-name"></span><span class="pt-sub"></span>';
  tab.querySelector('.pt-name').textContent = name;
  tabs.appendChild(tab);
  const page = document.createElement('div'); page.className = 'page'; page.setAttribute('role', 'tabpanel');
  const grid = document.createElement('div'); grid.className = 'page-grid';
  list.forEach(s => grid.appendChild(soundBtn(s)));
  page.appendChild(grid); pager.appendChild(page);
  refs.push({ list, tab, page, sub: tab.querySelector('.pt-sub') });
});
root.append(tabs, pager);

let current = 0, settle = null, lastW = 0;
const goTo = (i, smooth) => pager.scrollTo({ left: i * pager.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
const index = () => Math.max(0, Math.min(refs.length - 1, Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth))));
const mark = i => { current = i; refs.forEach((r, k) => r.tab.setAttribute('aria-selected', String(k === i))); };
const fit = () => { pager.style.height = refs[current].page.offsetHeight + 'px'; };
pager.addEventListener('scroll', () => { mark(index()); clearTimeout(settle); settle = setTimeout(fit, 140); }, { passive: true });
refs.forEach((r, i) => r.tab.addEventListener('click', () => goTo(i, true)));
new ResizeObserver(() => { const w = pager.clientWidth; if (w === lastW) return; lastW = w; goTo(current, false); fit(); }).observe(pager);
const pageRO = new ResizeObserver(fit); refs.forEach(r => pageRO.observe(r.page));

let drag = null, swallow = false;
pager.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { id: e.pointerId, x: e.clientX, left: pager.scrollLeft, start: index(), dx: 0, moved: false };
});
pager.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x;
  if (!drag.moved) { if (Math.abs(drag.dx) < 6) return; drag.moved = true; pager.setPointerCapture(e.pointerId); pager.classList.add('dragging'); }
  pager.scrollLeft = drag.left - drag.dx;
});
const endDrag = () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  swallow = true; setTimeout(() => { swallow = false; }, 0);
  pager.classList.remove('dragging');
  const w = pager.clientWidth;
  let target = Math.round((d.left - d.dx) / w);
  if (Math.abs(d.dx) > Math.min(60, w / 4)) target = d.start + (d.dx < 0 ? 1 : -1);
  goTo(Math.max(0, Math.min(refs.length - 1, target)), true);
};
pager.addEventListener('pointerup', endDrag); pager.addEventListener('pointercancel', endDrag);
pager.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); } }, true);

mark(0); lastW = pager.clientWidth; sync(); fit();
</script>
</body>
</html>
